services:
  postgres:
    image: postgres:16
    container_name: ai_wiki_db 
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_agent 
      POSTGRES_PASSWORD: agent$$1117 
      POSTGRES_DB: ai_wiki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_wiki_api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  pgdata:
